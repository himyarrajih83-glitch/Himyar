<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أثير | Aether</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'aether-dark': '#0A0A0A',
                        'aether-bg': '#121212',
                        'aether-primary': '#8A2BE2',
                        'aether-secondary': '#4A90E2',
                        'aether-accent': '#FFD700',
                        'aether-text-primary': '#E0E0E0',
                        'aether-text-secondary': '#A0A0A0',
                    },
                    animation: {
                        'fade-in': 'fade-in 0.5s ease-out forwards',
                        'bloom': 'bloom 1s ease-out forwards',
                        'subtle-pulse': 'subtle-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'insight-pop': 'insight-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'glowing-pulse': 'glowing-pulse 2.5s ease-out infinite',
                    },
                    keyframes: {
                        'fade-in': {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        'bloom': {
                            '0%': { transform: 'scale(0.95)', opacity: '0.5' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        },
                        'subtle-pulse': {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '.9' },
                        },
                        'insight-pop': {
                            '0%': { transform: 'scale(0.8)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        },
                        'glowing-pulse': {
                          '0%, 100%': { boxShadow: '0 0 10px #8A2BE2, 0 0 20px #8A2BE2' },
                          '50%': { boxShadow: '0 0 20px #4A90E2, 0 0 30px #4A90E2' }
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS Variables & Base Styles -->
    <style>
        :root {
            --aether-dark: #0A0A0A;
            --aether-bg: #121212;
            --aether-primary: #8A2BE2;
            --aether-secondary: #4A90E2;
            --aether-accent: #FFD700;
            --aether-text-primary: #E0E0E0;
            --aether-text-secondary: #A0A0A0;
        }
        body {
            background-color: var(--aether-bg);
            color: var(--aether-text-primary);
        }
    </style>

    <!-- Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "@google/generative-ai": "https://esm.sh/@google/generative-ai"
      }
    }
    </script>

    <!-- Mermaid.js -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
        mermaid.initialize({ startOnLoad: true, theme: 'dark' });
    </script>

</head>
<body class="bg-aether-bg text-aether-text-primary">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
